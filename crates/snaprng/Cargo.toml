[package]
name = "snaprng"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fork-, snapshot- and clone-aware CSPRNG that transparently reseeds before any output can collide"

[features]
default = ["watchdog", "wipe-on-fork", "rdseed", "vmgenid"]
# Background thread that samples clocks between draws.
watchdog = []
# MADV_WIPEONFORK sentinel page (Linux only, ignored elsewhere).
wipe-on-fork = []
# x86_64 hardware entropy (RDSEED/RDRAND) with runtime CPUID gating.
rdseed = []
# Hypervisor VM Generation ID device probing (Linux only, ignored elsewhere).
vmgenid = []
# Test harness hooks: cloneable RNG and injectable environment.
# NEVER enable this in production builds.
test-util = []

[dependencies]
rand.workspace = true
rand_core.workspace = true
rand_chacha.workspace = true
getrandom.workspace = true
sha2.workspace = true
libc.workspace = true

[dev-dependencies]
libc.workspace = true
